<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin - Shah Computer</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}body{background:#f1f5f9;padding:15px}.box{background:#fff;max-width:500px;margin:20px auto;padding:20px;border-radius:12px;box-shadow:0 4px 12px rgba(0,0,0,.1)}input{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:8px}button{width:100%;padding:12px;background:#0b1220;color:#fff;border:none;border-radius:8px;font-weight:700;margin-top:10px}img{width:60px;height:60px;object-fit:cover;border-radius:8px}.item{display:flex;justify-content:space-between;align-items:center;background:#f8fafc;padding:10px;margin:8px 0;border-radius:8px}</style></head><body>
<div class="box" id="loginBox"><h2 style="text-align:center">Shah Computer Admin</h2><p style="text-align:center;font-size:13px;color:#666;margin:8px 0">পাসওয়ার্ড: 01717280806</p><input type="password" id="pass" placeholder="পাসওয়ার্ড দিন"><button onclick="login()">Login</button></div>
<div class="box" id="adminBox" style="display:none"><h3>নতুন প্রোডাক্ট যোগ করুন</h3><input id="name" placeholder="প্রোডাক্টের নাম - যেমন: HP Laptop"><input id="price" placeholder="দাম - যেমন: 38500" type="number"><input id="img" placeholder="ছবির লিংক - বা নিচে ছবি আপলোড করুন"><input type="file" id="file" accept="image/*"><button onclick="add()">প্রোডাক্ট এড করুন</button><div id="list" style="margin-top:20px"></div><button style="background:#e11d48;margin-top:20px" onclick="location.href='index.html'">দোকানে ফিরে যান</button></div>
<script>
function login(){if(document.getElementById('pass').value=='01717280806'){document.getElementById('loginBox').style.display='none';document.getElementById('adminBox').style.display='block';show()}else alert('ভুল পাসওয়ার্ড! পাসওয়ার্ড: 01717280806')}
let products=JSON.parse(localStorage.getItem('shah_products')||'[]');
function add(){
let n=document.getElementById('name').value, p=document.getElementById('price').value, im=document.getElementById('img').value, file=document.getElementById('file').files[0];
if(!n||!p){alert('নাম ও দাম দিন');return}
if(file){let r=new FileReader();r.onload=e=>{save(n,p,e.target.result)};r.readAsDataURL(file)}else save(n,p,im||'https://images.unsplash.com/photo-1496181133206-80ce9b88a853')
}
function save(n,p,im){products.push([n,p,im]);localStorage.setItem('shah_products',JSON.stringify(products));document.getElementById('name').value='';document.getElementById('price').value='';document.getElementById('img').value='';show();alert('প্রোডাক্ট যোগ হয়েছে! এখন দোকানে গিয়ে দেখুন')}
function show(){let l=document.getElementById('list');l.innerHTML='<b>মোট প্রোডাক্ট: '+products.length+'</b>'+products.map((x,i)=>`<div class="item"><div style="display:flex;gap:10px;align-items:center"><img src="${x[2]}"><div><b>${x[0]}</b><br>৳${x[1]}</div></div><button style="width:auto;padding:5px 10px;background:#e11d48" onclick="del(${i})">X</button></div>`).join('')}
function del(i){if(confirm('ডিলিট করবেন?')){products.splice(i,1);localStorage.setItem('shah_products',JSON.stringify(products));show()}}
show();
</script></body></html>
