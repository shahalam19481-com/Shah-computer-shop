<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}body{background:#f1f5f9;padding:15px}.box{background:#fff;max-width:600px;margin:20px auto;padding:20px;border-radius:14px}input,textarea{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:8px}button{width:100%;padding:12px;background:#16a34a;color:#fff;border:none;border-radius:8px;font-weight:700;margin-top:10px}pre{background:#0b1220;color:#22c55e;padding:15px;border-radius:8px;overflow:auto;font-size:12px;margin-top:15px;white-space:pre-wrap;word-break:break-all}</style></head><body><div class="box" id="loginBox"><h2>Admin Login</h2><p style="font-size:13px;color:#666">পাসওয়ার্ড: 01717280806</p><input type="password" id="pass" placeholder="পাসওয়ার্ড"><button onclick="if(document.getElementById('pass').value=='01717280806'){loginBox.style.display='none';adminBox.style.display='block';load()}else alert('ভুল!')">Login</button></div><div class="box" id="adminBox" style="display:none"><h3>নতুন প্রোডাক্ট যোগ করুন</h3><input id="pName" placeholder="নাম - যেমন Motherboard 81"><input id="pPrice" placeholder="দাম - যেমন 3200 (শুধু সংখ্যা)"><input id="pImg" placeholder="ছবির লিংক - খালি রাখতে পারেন"><input type="file" id="pFile" accept="image/*"><button onclick="addProduct()">প্রোডাক্ট যোগ করুন</button><pre id="output">এখানে কোড আসবে...</pre><button onclick="copyCode()" style="background:#0b1220">কোড কপি করুন</button><p style="font-size:12px;margin-top:15px;background:#fef3c7;padding:10px;border-radius:8px"><b>কি করবেন:</b><br>১. কপি করুন<br>২. GitHub এ products.json Edit<br>৩. পুরানো কোড ডিলিট করে নতুন কোড পেস্ট করে Commit</p><button onclick="location.href='index.html'" style="background:#e11d48">দোকান দেখুন</button></div><script>let products=[];async function load(){try{let r=await fetch('products.json?v='+Date.now());products=await r.json()}catch(e){products=[]}show()}function show(){document.getElementById('output').textContent=JSON.stringify(products,null,2)}function addProduct(){let n=document.getElementById('pName').value.trim();let p=document.getElementById('pPrice').value.trim();let im=document.getElementById('pImg').value.trim();let fileInput=document.getElementById('pFile');if(!n||!p){alert('নাম দাম দিন');return;}p=p.replace(/[^0-9]/g,'');let addObj=(imgUrl)=>{products.push({name:n,price:p,img:imgUrl||'https://images.unsplash.com/photo-1496181133206-80ce9b88a853'});show();document.getElementById('pName').value='';document.getElementById('pPrice').value='';document.getElementById('pImg').value='';fileInput.value='';alert('যোগ হয়েছে! এখন কোড কপি করে products.json এ বসান')};if(fileInput.files[0]){let fr=new FileReader();fr.onload=e=>addObj(e.target.result);fr.readAsDataURL(fileInput.files[0])}else{addObj(im)}}function copyCode(){navigator.clipboard.writeText(document.getElementById('output').textContent).then(()=>alert('কপি হয়েছে!')).catch(()=>{let t=document.getElementById('output').textContent;prompt('কপি করুন:',t)})}load();</script></body></html>
