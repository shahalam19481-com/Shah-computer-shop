<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Fix</title><style>body{background:#f1f5f9;padding:15px;font-family:sans-serif}.box{background:#fff;max-width:500px;margin:20px auto;padding:20px;border-radius:14px}input{width:100%;padding:14px;margin:8px 0;border:2px solid #ddd;border-radius:10px;font-size:16px}button{width:100%;padding:14px;background:#16a34a;color:#fff;border:none;border-radius:10px;font-weight:700;margin-top:10px;font-size:16px}pre{background:#0b1220;color:#22c55e;padding:15px;border-radius:10px;overflow:auto;margin-top:15px;white-space:pre-wrap}</style></head><body><div class="box"><h2>নতুন প্রোডাক্ট - 100% কাজ করবে</h2><input id="a1" placeholder="নাম: Motherboard 81"><input id="a2" placeholder="দাম: 3200"><input type="file" id="a3" accept="image/*"><button onclick="go()" style="background:#16a34a">✅ প্রোডাক্ট যোগ করুন</button><pre id="out">কোড এখানে আসবে...</pre><button onclick="navigator.clipboard.writeText(document.getElementById('out').textContent);alert('কপি হয়েছে!')" style="background:#0b1220">কোড কপি করুন</button></div><script>let list=[];async function init(){try{let r=await fetch('products.json?v='+Date.now());list=await r.json()}catch(e){list=[]}document.getElementById('out').textContent=JSON.stringify(list,null,2)}function go(){let n=document.getElementById('a1').value.trim();let p=document.getElementById('a2').value.trim().replace(/[^0-9]/g,'');let f=document.getElementById('a3').files[0];if(!n||!p){alert('নাম আর দাম লিখো বন্ধু!');return}let add=(img)=>{list.push({name:n,price:p,img:img});document.getElementById('out').textContent=JSON.stringify(list,null,2);alert('হয়ে গেছে! এখন কোড কপি করে products.json এ বসাও')};if(f){let fr=new FileReader();fr.onload=e=>add(e.target.result);fr.readAsDataURL(f)}else{add('https://images.unsplash.com/photo-1496181133206-80ce9b88a853')}}init();</script></body></html>
