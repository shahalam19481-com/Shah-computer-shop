<!DOCTYPE html>
<html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shah Shop Super Admin</title>
<style>
body{font-family:sans-serif;background:#0f0f0f;color:#fff;padding:12px;margin:0}
h2{color:#0f0;text-align:center}
input{width:100%;padding:12px;margin:6px 0;border-radius:8px;border:0;box-sizing:border-box;font-size:15px}
.btn{width:100%;padding:12px;border:0;border-radius:8px;font-weight:bold;font-size:16px;margin:5px 0}
.card{background:#1e1e1e;padding:10px;border-radius:10px;margin:8px 0;display:flex;gap:10px;align-items:center}
.card img{width:60px;height:60px;border-radius:8px;object-fit:cover}
.card .info{flex:1} .card .info b{font-size:14px;display:block} .card .info small{color:#aaa}
.icon{padding:8px 12px;border-radius:6px;border:0;font-size:18px}
.token-box{background:#222;padding:10px;border-radius:8px;margin-bottom:12px}
</style></head><body>
<h2>🛠️ SHAH SHOP - SUPER ADMIN</h2>

<div class="token-box">
<b>🔑 প্রথমবার চাবি বসাও (Token):</b>
<input id="token" placeholder="ghp_xxxxxxxxxx পেস্ট করো এখানে">
<small>একবার বসালে আর লাগবে না, ব্রাউজারে সেভ থাকবে</small>
</div>

<input id="name" placeholder="প্রোডাক্ট নাম: যেমন Motherboard H81">
<input id="price" placeholder="দাম: যেমন 3200">
<input id="img" placeholder="ছবি লিংক (ফাঁকা রাখলে অটো ছবি আসবে)">
<button class="btn" style="background:#0f0;color:#000" onclick="addProduct()">+ নতুন প্রোডাক্ট যোগ করুন</button>
<button class="btn" style="background:#0ff;color:#000" onclick="saveAll()">💾 সব পরিবর্তন সেভ করুন (দোকানে দেখাবে)</button>
<p id="status" style="text-align:center;color:#0f0"></p>
<hr>
<div id="list">লোড হচ্ছে...</div>
<a href="index.html" style="color:#0f0;display:block;text-align:center;margin:20px">← দোকানে ফিরে যান</a>

<script>
let products=[],sha="",REPO="Shah-computer-shop",OWNER="shahalam19481-com",PATH="products.json";
let savedToken=localStorage.getItem("shah_token");
if(savedToken)document.getElementById("token").value=savedToken;

async function load(){
 let r=await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${PATH}?t=${Date.now()}`);
 let j=await r.json(); sha=j.sha;
 products=JSON.parse(atob(j.content)); render();
}
function render(){
 let h=""; products.forEach((p,i)=>{
 h+=`<div class="card"><img src="${p.img}"><div class="info"><b>${p.name}</b><small>৳ ${p.price}</small></div>
 <button class="icon" style="background:#ff0" onclick="editProduct(${i})">✏️</button>
 <button class="icon" style="background:#f33" onclick="deleteProduct(${i})">🗑️</button></div>`;
 }); document.getElementById("list").innerHTML=h;
}
function addProduct(){
 let n=document.getElementById('name').value.trim(), pr=document.getElementById('price').value.trim();
 let im=document.getElementById('img').value.trim()||"https://images.unsplash.com/photo-1587202372775-e229f172b9d7";
 if(!n||!pr){alert("নাম আর দাম লেখো বন্ধু!");return}
 products.unshift({name:n,price:pr,img:im}); render();
 document.getElementById('name').value=""; document.getElementById('price').value=""; document.getElementById('img').value="";
}
function editProduct(i){
 let p=products[i];
 let nn=prompt("নতুন নাম লেখো:",p.name); if(nn===null)return;
 let pp=prompt("নতুন দাম লেখো:",p.price); if(pp===null)return;
 let ii=prompt("নতুন ছবি লিংক:",p.img); if(ii===null)return;
 products[i]={name:nn||p.name, price:pp||p.price, img:ii||p.img}; render();
}
function deleteProduct(i){ if(confirm("এই প্রোডাক্ট ডিলিট করবে?")){products.splice(i,1); render()} }

async function saveAll(){
 let t=document.getElementById('token').value.trim(); if(!t){alert("আগে Token বসাও বন্ধু!");return}
 localStorage.setItem("shah_token",t);
 document.getElementById('status').innerText="⏳ সেভ হচ্ছে, ১০ সেকেন্ড অপেক্ষা করো...";
 let content=btoa(unescape(encodeURIComponent(JSON.stringify(products,null,2))));
 let body=JSON.stringify({message:"update products by admin",content:content,sha:sha});
 let res=await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${PATH}`,{method:"PUT",headers:{"Authorization":"token "+t,"Content-Type":"application/json"},body:body});
 if(res.ok){document.getElementById('status').innerText="✅ হয়ে গেছে! ১ মিনিট পর দোকানে দেখাবে!"; alert("সফল! এখন তোমার দোকান আপডেট হয়ে যাবে ১ মিনিটে"); load()}
 else{let e=await res.text(); document.getElementById('status').innerText="❌ হয়নি"; alert("Error: "+e)}
}
load();
</script></body></html>
