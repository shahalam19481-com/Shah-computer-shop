<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shah Computer - Nabiganj</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Hind Siliguri,sans-serif}body{background:#f8fafc}header{background:#0b1220;color:#fff;padding:15px;text-align:center;position:sticky;top:0;z-index:10}.logo{font-size:22px;font-weight:800}.logo span{color:#22c55e}.hero{background:linear-gradient(135deg,#0b1220,#1e293b);color:#fff;padding:30px 15px;text-align:center}.hero h1{font-size:24px}.hero p{opacity:.8;margin-top:8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:15px;max-width:900px;margin:auto}.card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.06)}.card img{width:100%;height:150px;object-fit:cover}.info{padding:10px}.price{color:#16a34a;font-weight:800;font-size:18px}.btn{width:100%;padding:10px;background:#25D366;color:#fff;border:none;border-radius:8px;font-weight:700;margin-top:8px}footer{text-align:center;padding:20px;color:#666;font-size:13px}.admin-link{position:fixed;bottom:15px;right:15px;background:#0b1220;color:#fff;padding:10px 14px;border-radius:20px;font-size:12px;text-decoration:none}</style></head><body><header><div class="logo">SHAH <span>COMPUTER</span> SHOP</div><div style="font-size:11px;opacity:.7">Nabiganj Bazar, Habiganj | 01717-280806</div></header><div class="hero"><h1>স্বল্প দামে অরিজিনাল কম্পিউটার</h1><p>নবীগঞ্জ বাজারের বিশ্বস্ত কম্পিউটার দোকান</p></div><div class="grid" id="grid">লোড হচ্ছে...</div><footer>© Shah Computer Shop - গরিবের বিশ্বস্ত দোকান<br>প্রোডাক্ট কিনতে WhatsApp করুন</footer><a class="admin-link" href="admin.html">Admin Login</a><script>async function load(){try{let r=await fetch('products.json?v='+Date.now());let p=await r.json();let g=document.getElementById('grid');g.innerHTML=p.map(x=>`<div class="card"><img src="${x.img}"><div class="info"><div style="font-weight:700;font-size:14px">${x.name}</div><div class="price">৳ ${x.price}</div><button class="btn" onclick="order('${x.name}','${x.price}')">WhatsApp এ অর্ডার</button></div></div>`).join('')}catch(e){document.getElementById('grid').innerHTML='প্রোডাক্ট লোড হচ্ছে না, products.json ফাইল চেক করুন'}}function order(n,p){let msg=`আসসালামু আলাইকুম, আমি ${n} (৳${p}) কিনতে চাই। - Shah Computer Shop`;window.open(`https://wa.me/8801717280806?text=${encodeURIComponent(msg)}`,'_blank')}load();</script></body></html>
